[project]
name = "quorum"
version = "0.1.0"
description = "Compuerta determinista de procedencia entre agentes de IA"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eval = ["inspect-ai", "openai", "numpy", "matplotlib", "pyyaml"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # el proyecto está escrito en español
