[project]
name = "quorum"
version = "0.1.0"
description = "Compuerta determinista de procedencia entre agentes de IA"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eval = ["inspect-ai", "openai", "numpy", "matplotlib", "pyyaml"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
